[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woolshed"
version = "1.0.0"
description = "Wool Value-Chain Optimisation Tool – MILP solver with interactive map"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WOOLSHED / Alpine Space / Interreg" }]

dependencies = [
    "Flask>=3.0",
    "openpyxl>=3.1",
    "PuLP>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
]

[project.scripts]
woolshed = "woolshed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
